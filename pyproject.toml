[project]
name = "selfdrive-sim"
version = "0.1.0"
description = "A self-driving car simulator: A*, path smoothing, PID, and a particle filter"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
